      // Mini App launch (that's also where window.Telegram.WebApp.initData

      // inside Telegram" from "opened as a normal website" BEFORE loading
      // anything. Only fetch the SDK for the former: a plain browser/phone
      // visit has no use for it, and telegram.org being slow or blocked on
      // a visitor's network (common for a VPN-service audience) must not
      // hold up the site — see the outage this fixed, where the script's
      // hung connection blocked the whole page for non-Telegram visitors.
      // window.__tgReady resolves once the SDK has loaded (or failed/timed
      // out) — auth.js awaits it before trusting window.Telegram.WebApp,
      // so it can't race a dynamically-injected <script> that's still

      // Telegram account win over the fresh one Telegram just launched

      // problem it exists to catch). The 3s timeout keeps the promise from
      // hanging forever on a slow/blocked telegram.org, same reasoning as
      // not loading it at all for non-Telegram visitors below.
