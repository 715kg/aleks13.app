    <script type="text/javascript">
      // Single Page Apps for GitHub Pages — decodes the path that 404.html
      // encoded into ?/... before redirecting here, and restores it via
      // history.replaceState so Vue Router sees the real deep-linked URL.
      // https://github.com/rafgraph/spa-github-pages
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>

    <script type="text/javascript">
      // Telegram's client appends tgWebApp* params to the URL hash on every
      // Mini App launch (that's also where window.Telegram.WebApp.initData
      // comes from) — so its presence is a reliable way to tell "opened
      // inside Telegram" from "opened as a normal website" BEFORE loading
      // anything. Only fetch the SDK for the former: a plain browser/phone
      // visit has no use for it, and telegram.org being slow or blocked on
      // a visitor's network (common for a VPN-service audience) must not
      // hold up the site — see the outage this fixed, where the script's
      // hung connection blocked the whole page for non-Telegram visitors.
      if (/tgWebApp/.test(window.location.hash)) {
        var tgScript = document.createElement('script')
        tgScript.src = 'https://telegram.org/js/telegram-web-app.js'
        document.head.appendChild(tgScript)
      }
    </script>
