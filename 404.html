<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>ALEKS13.APP</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages has no server-side rewrites, so any deep link (e.g.
      // /dashboard/install) that isn't a real file 404s here. This encodes
      // the intended path into a query string and redirects to index.html,
      // which decodes it back (see the inline script in index.html) before
      // Vue Router ever sees the URL — so refreshes and shared links work.
      //
      // pathSegmentsToKeep: 0 for a custom domain or a user/org site
      // (username.github.io). Set to 1 if deploying to a GitHub Pages
      // project subpath (username.github.io/repo-name), to keep the
      // repo-name segment in the redirected URL.
      var pathSegmentsToKeep = 0

      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
